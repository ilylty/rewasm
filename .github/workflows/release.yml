name: Release
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as draft"
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system deps
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libz3-dev
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install z3
          fi
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifacts
        shell: bash
        run: |
          ASSET="rewasm-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/rewasm${{ matrix.ext }}" "$ASSET"
          if [ "${{ runner.os }}" = "Windows" ]; then
            zip "rewasm-${{ matrix.target }}.zip" "$ASSET"
          else
            tar czf "rewasm-${{ matrix.target }}.tar.gz" "$ASSET"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rewasm-${{ matrix.target }}
          path: rewasm-${{ matrix.target }}.*
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute version
        id: version
        run: |
          echo "version=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: "Release: Tag"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: |
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} \; > checksums.txt
      - name: "Release: Create"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/**/*
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          body: |
            ${{ inputs.release_notes }}

            ---
            ## Usage

            See README.md for full usage instructions.

            ```
            rewasm example.wasm > example.dec
            rewasm example.wasm 42
            ```

            ## Artifacts

            - **Linux (amd64)**: `rewasm-x86_64-unknown-linux-gnu.tar.gz`
            - **Windows (amd64)**: `rewasm-x86_64-pc-windows-msvc.zip`
            - **macOS (amd64)**: `rewasm-x86_64-apple-darwin.tar.gz`
            - **macOS (arm64)**: `rewasm-aarch64-apple-darwin.tar.gz`

            *SHA256 checksums included in `checksums.txt`.*
